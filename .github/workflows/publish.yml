name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v4.0.4)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v4.0.4)'
        required: true
        type: string

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(./gradlew -q properties | grep "^version:" | awk '{print $2}')
          echo "version=$version tag=$TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Project version $version does not match tag $TAG"
            exit 1
          fi

      - name: Publish plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: >
          ./gradlew :compile:publishPlugins
          -Pgradle.publish.key="$GRADLE_PUBLISH_KEY"
          -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
